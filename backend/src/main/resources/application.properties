spring.application.name=shortlink-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shortlink}
spring.datasource.username=${DB_USER:shortlink}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.token-secret=${TOKEN_SECRET}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.short-base-url=${SHORT_BASE_URL:http://localhost:8787}
